  <script>
    /* Bump the Friday service-worker script URL so a newly uploaded index can refresh old cached shells. */
    (() => {
      if (!('serviceWorker' in navigator) || navigator.__fridaySwVersionHook) return;
      const originalRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
      navigator.serviceWorker.register = (scriptURL, options) => {
        try {
          const url = new URL(scriptURL, location.href);
          if (url.pathname.endsWith('/sw.js')) url.searchParams.set('v', 'friday-ui-20261124c');
          return originalRegister(url.href, options);
        } catch (_) { return originalRegister(scriptURL, options); }
      };
      navigator.__fridaySwVersionHook = true;
    })();
  </script>

  <script>
  /* Friday UI additions. Uses the same IndexedDB database; does not clear or migrate chat history. */
  (() => {
    'use strict';
    const DB_NAME = 'sidechat-local-db';
    const byId = id => document.getElementById(id);
    const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    let dbPromise = null, activeChatId = null, statsBusy = false, lastStatsKey = '';
    const num = value => Number(value || 0).toLocaleString('en-US');
    function installUsageCapture() {
      if (window.__fridayUsageCaptureInstalled) return;
      window.__fridayUsageCaptureInstalled = true;
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        let isCompletion = false, model = 'unknown';
        try {
          const url = new URL(input instanceof Request ? input.url : String(input), location.href);
          isCompletion = url.pathname.endsWith('/chat/completions');
          if (typeof init?.body === 'string') model = JSON.parse(init.body).model || model;
        } catch (_) {}
        const row = document.querySelector('#chat-list .chat-list-item.active');
        const chatId = row?.dataset.chatId || activeChatId || 'unknown';
        const response = await originalFetch(input, init);
        if (isCompletion && response.ok) {
          // Usage history is auxiliary: persist it asynchronously so it cannot delay
          // the application from receiving or rendering the model response.
          void response.clone().json()
            .then(data => data?.usage ? appendTrendUsage(chatId, model, data.usage) : undefined)
            .catch(error => console.warn('Friday Token trend capture skipped:', error));
        }
        return response;
      };
    }
    async function appendTrendUsage(chatId, model, usage) {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('settings', 'readwrite');
        const settings = tx.objectStore('settings');
        const request = settings.get('token-trend-history');
        request.onsuccess = () => {
          const entries = Array.isArray(request.result?.value) ? request.result.value : [];
          entries.push({ timestamp:new Date().toISOString(), chatId, model, prompt_tokens:Number(usage.prompt_tokens||0), completion_tokens:Number(usage.completion_tokens||0), reasoning_tokens:Number(usage.completion_tokens_details?.reasoning_tokens||usage.reasoning_tokens||0), total_tokens:Number(usage.total_tokens||0) });
          settings.put({ key:'token-trend-history', value:entries.slice(-5000) });
        };
        request.onerror = () => reject(request.error);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
      });
    }
    installUsageCapture();
    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return dbPromise;
    }
    function readStores(names) {
      return openDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(names, 'readonly'), values = {};
        names.forEach(name => {
          const req = tx.objectStore(name).getAll();
          req.onsuccess = () => { values[name] = req.result || []; };
          req.onerror = () => reject(req.error);
        });
        tx.oncomplete = () => resolve(values);
        tx.onerror = () => reject(tx.error);
      }));
    }
    function setHeaderText(chats, messages, settings) {
      const activeRow = document.querySelector('#chat-list .chat-list-item.active');
      const id = activeRow?.dataset.chatId || activeChatId;
      if (!id) return;
      activeChatId = id;
      const chat = chats.find(x => x.id === id);
      const rawName = String(chat?.name || '').trim();
      const unnamed = !rawName || ['新对话','未命名','当前对话','new chat','untitled'].includes(rawName.toLowerCase());
      const title = unnamed ? '当前对话' : rawName;
      const titleNode = byId('active-chat-title');
      if (titleNode && titleNode.textContent !== title) titleNode.textContent = title;
      const current = messages.filter(m => m.chatId === id);
      const chars = current.reduce((sum, m) => sum + Array.from(String(m.content || '')).length, 0);
      const usageStats = settings.find(x => x.key === 'token-usage')?.value;
      const tokens = Number(usageStats?.chats?.[id]?.total_tokens ?? current.reduce((sum, m) => sum + (m.role === 'assistant' ? Number(m.usage?.total_tokens || 0) : 0), 0));
      const line = byId('chat-subtitle');
      const display = `${num(chars)} 字符 · ${num(tokens)} Tokens`;
      if (line && line.textContent !== display) line.textContent = display;
    }
    let headerRefreshTimer = 0;
    let headerRefreshPending = false;

    function scheduleHeaderRefresh() {
      if (headerRefreshTimer) clearTimeout(headerRefreshTimer);
      headerRefreshTimer = setTimeout(() => {
        headerRefreshTimer = 0;
        refreshHeader();
      }, 260);
    }

    async function refreshHeader() {
      if (statsBusy) {
        headerRefreshPending = true;
        return;
      }
      statsBusy = true;
      try {
        const data = await readStores(['chats','messages','settings']);
        setHeaderText(data.chats, data.messages, data.settings);
      } catch (error) { console.warn('Friday header stats unavailable:', error); }
      finally {
        statsBusy = false;
        if (headerRefreshPending) {
          headerRefreshPending = false;
          scheduleHeaderRefresh();
        }
      }
    }

    function installHeaderObserver() {
      refreshHeader();
      const observer = new MutationObserver(scheduleHeaderRefresh);
      const list = byId('chat-list');
      const messageArea = byId('messages');
      const titleNode = byId('active-chat-title');

      if (list) observer.observe(list, {
        childList:true,
        subtree:true,
        attributes:true,
        attributeFilter:['class']
      });

      // Ignore high-frequency characterData changes; update once after message DOM settles.
      if (messageArea) observer.observe(messageArea, {
        childList:true,
        subtree:true
      });

      if (titleNode) observer.observe(titleNode, {
        childList:true,
        characterData:true,
        subtree:true
      });
    }

    function ensureOverlayStyles() {
      const style = document.createElement('style');
      style.textContent = `
        .friday-action { height:36px;min-width:36px;border:1px solid #e1e9e1;border-radius:10px;background:#fff;color:#527261;font-size:11px;font-weight:650;padding:0 10px; }
        .friday-action.primary {border:0;background:#16875f;color:#fff;}
        .friday-action:active {filter:brightness(.97);}
        .long-editor-actions .friday-action {height:39px;min-width:76px;border-radius:11px;}
        .history-counter {color:#88978d;font-size:10px;align-self:center;}
      `;
      document.head.appendChild(style);
    }
    function makeModal(className, sheetClass, title, closeLabel='关闭') {
      const overlay = document.createElement('div'); overlay.className = className;
      const sheet = document.createElement('section'); sheet.className = sheetClass; sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true');
      const head = document.createElement('div'); head.className = className.includes('history') ? 'history-picker-head' : 'long-editor-head';
      const h2 = document.createElement('h2'); h2.textContent = title;
      const close = document.createElement('button'); close.className = 'plain-icon'; close.type='button'; close.textContent='×'; close.setAttribute('aria-label',closeLabel);
      head.append(h2,close); sheet.append(head); overlay.append(sheet);
      close.addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
      document.body.append(overlay);
      return {overlay,sheet,close};
    }
    function insertFormat(textarea, before, after='', fallback='') {
      const start=textarea.selectionStart, end=textarea.selectionEnd;
      const selected=textarea.value.slice(start,end) || fallback;
      const insertion=before+selected+after;
      textarea.setRangeText(insertion,start,end,'select');
      textarea.focus();
      const offset=start+before.length;
      textarea.setSelectionRange(offset,offset+selected.length);
    }
    async function openHistoryPicker(editor) {
      const modal=makeModal('history-picker-backdrop','history-picker-sheet','引用历史对话');
      const search=document.createElement('input'); search.className='history-search'; search.type='search'; search.placeholder='搜索历史消息或子对话名称';
      const list=document.createElement('div'); list.className='history-list';
      const foot=document.createElement('div'); foot.className='long-editor-foot';
      const counter=document.createElement('small'); counter.className='history-counter'; counter.textContent='已选择 0 条';
      const actions=document.createElement('div'); actions.className='long-editor-actions';
      const cancel=document.createElement('button'); cancel.className='friday-action'; cancel.textContent='取消';
      const confirm=document.createElement('button'); confirm.className='friday-action primary'; confirm.textContent='插入引用';
      actions.append(cancel,confirm); foot.append(counter,actions);
      modal.sheet.append(search,list,foot);
      cancel.addEventListener('click',()=>modal.overlay.remove());
      let rows=[]; const selected=new Set();
      try {
        const data=await readStores(['chats','messages']);
        const chatMap=new Map(data.chats.map(c=>[c.id,c]));
        rows=data.messages.filter(m=>m.content && (m.role==='user'||m.role==='assistant')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(m=>({message:m,chat:chatMap.get(m.chatId)}));
      } catch(error) { list.innerHTML='<div class="history-empty">无法读取本地历史记录</div>'; return; }
      const updateCounter=()=>counter.textContent=`已选择 ${selected.size} 条`;
      function renderRows() {
        const q=search.value.trim().toLowerCase();
        const matched=rows.filter(x=>!q || `${x.chat?.name||'当前对话'} ${x.message.content}`.toLowerCase().includes(q));
        list.innerHTML='';
        if(!matched.length){list.innerHTML='<div class="history-empty">没有找到匹配的历史消息</div>';return;}
        const frag=document.createDocumentFragment();
        matched.forEach(({message,chat})=>{
          const label=document.createElement('label'); label.className='history-entry';
          const check=document.createElement('input'); check.type='checkbox'; check.checked=selected.has(message.id);
          check.addEventListener('change',()=>{check.checked?selected.add(message.id):selected.delete(message.id);updateCounter();});
          const content=document.createElement('div'); content.className='history-entry-content';
          const meta=document.createElement('div'); meta.className='history-entry-top';
          const left=document.createElement('span'); left.textContent=`${chat?.name||'当前对话'} · ${message.role==='user'?'用户':'Friday'}`;
          const right=document.createElement('span'); right.textContent=message.createdAt?new Date(message.createdAt).toLocaleString() : '';
          meta.append(left,right);
          const excerpt=document.createElement('div'); excerpt.className='history-entry-text';
          const text=String(message.content||''); excerpt.textContent=text.length>320?`${text.slice(0,320)}…`:text;
          content.append(meta,excerpt); label.append(check,content); frag.append(label);
        });
        list.append(frag);
      }
      search.addEventListener('input',renderRows); renderRows();
      confirm.addEventListener('click',()=>{
        const selectedRows=rows.filter(x=>selected.has(x.message.id));
        if(!selectedRows.length){modal.overlay.remove();return;}
        const block='\n\n【引用的历史对话】\n'+selectedRows.reverse().map(({message,chat})=>{
          const when=message.createdAt?new Date(message.createdAt).toLocaleString():'';
          return `【${chat?.name||'当前对话'}｜${message.role==='user'?'用户':'Friday'}｜${when}】\n${message.content}`;
        }).join('\n\n')+'\n【历史引用结束】\n';
        const start=editor.selectionStart,end=editor.selectionEnd;
        editor.setRangeText(block,start,end,'end'); editor.focus();
        modal.overlay.remove();
      });
    }
    function openLongEditor() {
      const mainInput=byId('message-input');
      const modal=makeModal('long-editor-backdrop','long-editor-sheet','编辑长文本');
      const toolbar=document.createElement('div'); toolbar.className='long-editor-tools';
      const editor=document.createElement('textarea'); editor.id='long-editor-text'; editor.setAttribute('aria-label','长文本输入'); editor.placeholder='在这里输入长文本。按回车换行，使用右下角发送按钮发送。'; editor.value=mainInput.value;
      const controls=[
        ['B','**','**','粗体'],['I','*','*','斜体'],['H1','\n# ','\n','一级标题'],['H2','\n## ','\n','二级标题'],
        ['• 列表','\n- ','','无序列表'],['1. 列表','\n1. ','','有序列表'],['引用','\n> ','','引用段落'],['代码','\n```\n','\n```\n','代码块'],['分隔线','\n\n---\n\n','','分隔线']
      ];
      controls.forEach(([label,before,after,title])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.title=title;b.addEventListener('click',()=>insertFormat(editor,before,after,'文字'));toolbar.append(b);});
      const ref=document.createElement('button');ref.type='button';ref.textContent='引用历史';ref.title='从历史对话中选择内容';ref.addEventListener('click',()=>openHistoryPicker(editor));toolbar.append(ref);
      const foot=document.createElement('div');foot.className='long-editor-foot';
      const hint=document.createElement('small');hint.textContent='回车换行 · 点击发送按钮发送';
      const actions=document.createElement('div');actions.className='long-editor-actions';
      const cancel=document.createElement('button');cancel.type='button';cancel.className='friday-action';cancel.textContent='取消';
      const send=document.createElement('button');send.type='button';send.className='friday-action primary';send.textContent='发送';
      cancel.addEventListener('click',()=>modal.overlay.remove());
      send.addEventListener('click',()=>{
        mainInput.value=editor.value;
        mainInput.dispatchEvent(new Event('input',{bubbles:true}));
        modal.overlay.remove();
        byId('send-button').click();
      });
      actions.append(cancel,send);foot.append(hint,actions);
      modal.sheet.append(toolbar,editor,foot);
      setTimeout(()=>{editor.focus();editor.setSelectionRange(editor.value.length,editor.value.length);},60);
    }

    async function showTokenTrend() {
      const data=await readStores(['chats','messages','settings']);
      const allMessages=data.messages||[];
      const trendRow=(data.settings||[]).find(x=>x.key==='token-trend-history');
      const usageLog=Array.isArray(trendRow?.value)?trendRow.value:[];

  <script>
  /* Friday · 悬浮窗边缘收纳 + 搜索链接折叠（独立模块，不依赖 app.js 内部实现） */
  (() => {
    'use strict';
    const body = document.body;

    /* ---------- 1. 悬浮球收纳到屏幕左/右边缘 ---------- */
    ['left', 'right'].forEach(side => {
      const zone = document.createElement('div');
      zone.className = 'edge-zone ' + side;
      zone.setAttribute('aria-hidden', 'true');
      zone.addEventListener('click', () => openOrbs(side));
      document.body.appendChild(zone);
    });

    let lastTouch = Date.now();
    const panelOpen = () => !!document.querySelector('.float-panel:not([hidden])');
    const orbs = () => Array.from(document.querySelectorAll('.float-orb'));
    function measureOrbs() {
      const els = orbs();
      els.forEach(o => o.classList.add('measuring'));
      const w = window.innerWidth;
      const rects = els.map(o => o.getBoundingClientRect());
      els.forEach((o, i) => {
        const r = rects[i];
        const toRight = (r.left + r.right) / 2 >= w / 2;
        o.style.setProperty('--hide-x', (toRight ? w - r.left + 8 : -(r.right + 8)) + 'px');
      });
      els.forEach(o => o.classList.remove('measuring'));
    }
    function openOrbs() { body.classList.add('orbs-open'); lastTouch = Date.now(); }
    function closeOrbs() { measureOrbs(); body.classList.remove('orbs-open'); }
    window.addEventListener('resize', () => { if (!body.classList.contains('orbs-open')) measureOrbs(); });
    window.addEventListener('load', measureOrbs);
    measureOrbs();

    // 点击悬浮球/面板之外的区域 → 收起
    document.addEventListener('pointerdown', e => {
      if (!body.classList.contains('orbs-open')) return;
      if (e.target.closest('.float-orb, .float-panel, .modal-backdrop, .long-editor-backdrop, .history-picker-backdrop')) { lastTouch = Date.now(); return; }
      if (!panelOpen()) closeOrbs();
    }, true);

    // 无操作 3.5 秒且没有面板打开 → 自动收起
    setInterval(() => {
      if (body.classList.contains('orbs-open') && !panelOpen() && Date.now() - lastTouch > 3500) closeOrbs();
    }, 600);

    // 从屏幕边缘向内滑动 → 唤出
    let swipe = null;
    window.addEventListener('touchstart', e => {
      const t = e.touches[0]; if (!t) return;
      const w = window.innerWidth;
      if (t.clientX <= 22) swipe = { side: 'left', x: t.clientX };
      else if (t.clientX >= w - 22) swipe = { side: 'right', x: t.clientX };
      else swipe = null;
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (!swipe) return;
      const t = e.touches[0]; if (!t) return;
      const dx = swipe.side === 'left' ? t.clientX - swipe.x : swipe.x - t.clientX;
      if (dx > 26) { openOrbs(swipe.side); swipe = null; }
    }, { passive: true });
    window.addEventListener('touchend', () => { swipe = null; }, { passive: true });

    /* ---------- 2. 联网搜索结果链接折叠 ---------- */
    const LABEL_RE = /(来源|参考|搜索结果|相关链接|链接|引用|资料|出处|sources?|references?|citations?|links?)/i;
    const isLink = a => /^https?:/i.test(a.getAttribute('href') || '');

    function buildFold(count, label) {
      const d = document.createElement('details');
      d.className = 'src-fold';
      const s = document.createElement('summary');
      s.textContent = '🔗 ' + (label || '搜索来源') + ' · ' + count + ' 条链接';
      const inner = document.createElement('div');
      inner.className = 'src-fold-body';
      d.append(s, inner);
      return { d, inner };
    }
    function takeLabel(el) {
      const prev = el.previousElementSibling;
      if (!prev || prev.closest('details.src-fold')) return null;
      const t = (prev.textContent || '').trim();
      if (t.length > 0 && t.length <= 30 && LABEL_RE.test(t) && !prev.querySelector('a')) return prev;
      return null;
    }
    function foldList(list) {
      if (list.closest('details.src-fold')) return;
      const items = Array.from(list.children).filter(x => x.tagName === 'LI');
      if (items.length < 2) return;
      const ok = items.every(li => {
        const a = li.querySelector('a');
        return a && isLink(a) && (li.textContent || '').length <= 260;
      });
      if (!ok) return;
      const labelEl = takeLabel(list);
      const { d, inner } = buildFold(items.length, labelEl ? labelEl.textContent.trim().replace(/[:：]$/, '') : '');
      list.replaceWith(d);
      inner.appendChild(list);
      if (labelEl) labelEl.remove();
    }
    function foldParagraph(p) {
      if (p.closest('details.src-fold')) return;
      const links = Array.from(p.querySelectorAll('a')).filter(isLink);
      if (links.length < 2) return;
      let rest = p.textContent || '';
      links.forEach(a => { rest = rest.replace(a.textContent || '', ''); });
      if (rest.replace(/[\s\d\[\]()（）、,，.。:：·•\-—|]/g, '').length > 40) return;
      const labelEl = takeLabel(p);
      const { d, inner } = buildFold(links.length, labelEl ? labelEl.textContent.trim().replace(/[:：]$/, '') : '');
      p.replaceWith(d);
      inner.appendChild(p);
      if (labelEl) labelEl.remove();
    }
    function processMessages() {
      const root = document.getElementById('messages');
      if (!root) return;
      root.querySelectorAll('a[href]').forEach(a => {
        if (isLink(a)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      });
      root.querySelectorAll('ul, ol').forEach(foldList);
      root.querySelectorAll('p').forEach(foldParagraph);
    }
    let raf = 0;
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; try { processMessages(); } catch (e) { console.warn('Friday fold:', e); } });
    }
    // 导出 PDF / 打印时展开所有折叠的来源，避免链接丢失
    window.addEventListener('beforeprint', () => document.querySelectorAll('details.src-fold').forEach(d => { d.open = true; }));
    function startObserver() {
      const root = document.getElementById('messages');
      if (!root) return;
      new MutationObserver(schedule).observe(root, { childList: true, subtree: true });
      schedule();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startObserver, { once: true });
    else startObserver();
  })();
  </script>

  
  <script id="friday-viewport-shell">
  (() => {
    'use strict';
    if (window.__fridayNativeChatShellV2) return;
    window.__fridayNativeChatShellV2 = true;

    const root = document.documentElement;
    const viewport = window.visualViewport;
    const composer = document.getElementById('composer-wrap');
    const input = document.getElementById('message-input');

    let frame = 0;
    let baselineHeight = Math.round(viewport?.height || window.innerHeight || 1);
    let savedKeyboardHeight = 0;
    let keyboardOpen = false;
    let closingFromBlur = false;
    let lastOpenHeight = 0;
    let lastTop = -1;
    let lastHeight = -1;
    let lastViewportHeight = baselineHeight;
    let lastTouchY = null;
    let touchScroller = null;
    let ignoreUntilViewportRestored = false;

    const scrollSelector = [
      '#chat-scroll',
      '.float-panel',
      '.chat-list',
      '.settings-sheet',
      '.long-editor-sheet',
      '.history-picker-sheet',
      '.history-list',
      '.token-chat-usage',
      '#long-editor-text',
      '#message-input',
      '.bubble pre'
    ].join(',');

    const openThreshold = () => Math.max(100, baselineHeight * 0.12);
    const restoreTolerance = () => Math.max(18, Math.min(28, baselineHeight * 0.03));

    function viewportHeight() {
      return Math.round(viewport?.height || window.innerHeight || baselineHeight);
    }

    function pagePanTop() {
      if (!viewport) return 0;
      const pageTop = Number(viewport.pageTop);
      const offsetTop = Number(viewport.offsetTop);
      const documentScroll = window.scrollY || document.documentElement.scrollTop || 0;
      const pagePan = Number.isFinite(pageTop) ? pageTop - documentScroll : 0;
      return Math.max(0, pagePan, Number.isFinite(offsetTop) ? offsetTop : 0);
    }

    function applyShell(top, height, open) {
      const nextTop = Math.round(Math.max(0, top));
      const nextHeight = Math.round(Math.max(1, height));

      if (nextTop !== lastTop) {
        root.style.setProperty('--friday-vv-top', nextTop + 'px');
        lastTop = nextTop;
      }
      if (nextHeight !== lastHeight) {
        root.style.setProperty('--friday-vv-height', nextHeight + 'px');
        lastHeight = nextHeight;
      }
      root.classList.toggle('friday-keyboard-open', !!open);
    }

    function scheduleSync() {
      if (frame) return;
      frame = requestAnimationFrame(syncViewport);
    }

    function syncViewport() {
      frame = 0;
      const height = viewportHeight();

      // While a blur-triggered keyboard animation is running, keep the shell
      // restored and ignore the intermediate visualViewport resize frames.
      if (ignoreUntilViewportRestored) {
        if (height < baselineHeight - restoreTolerance()) {
          lastViewportHeight = height;
          return;
        }
        ignoreUntilViewportRestored = false;
        closingFromBlur = false;
        baselineHeight = height;
        root.classList.remove('friday-keyboard-prelift');
        root.style.setProperty('--friday-keyboard-height', '0px');
        applyShell(0, height, false);
        lastViewportHeight = height;
        return;
      }

      const keyboardDelta = Math.max(0, baselineHeight - height);

      if (!keyboardOpen) {
        if (keyboardDelta > openThreshold()) {
          keyboardOpen = true;
          closingFromBlur = false;
          savedKeyboardHeight = Math.round(keyboardDelta);
          root.style.setProperty('--friday-keyboard-height', savedKeyboardHeight + 'px');
          root.classList.remove('friday-keyboard-prelift');
          lastOpenHeight = height;
          applyShell(pagePanTop(), height, true);
        } else {
          baselineHeight = height;
          root.classList.remove('friday-keyboard-prelift');
          applyShell(0, height, false);
        }
      } else {
        // While opening, allow only meaningful keyboard-height changes to
        // reach layout; ignore tiny browser viewport oscillations.
        if (!closingFromBlur && height < lastOpenHeight - 38) {
          savedKeyboardHeight = Math.round(Math.max(0, baselineHeight - height));
          root.style.setProperty('--friday-keyboard-height', savedKeyboardHeight + 'px');
          lastOpenHeight = height;
          applyShell(pagePanTop(), height, true);
        } else if (!closingFromBlur) {
          const top = pagePanTop();
          if (Math.abs(top - lastTop) > 2) applyShell(top, lastHeight, true);
        }

        // OS keyboard dismissal without a DOM blur is handled when the viewport
        // has nearly returned to its pre-keyboard height.
        if (keyboardOpen && keyboardDelta <= restoreTolerance()) {
          keyboardOpen = false;
          closingFromBlur = false;
          root.classList.remove('friday-keyboard-prelift');
          root.style.setProperty('--friday-keyboard-height', '0px');
          applyShell(0, baselineHeight, false);
          baselineHeight = height;
        }
      }

      lastViewportHeight = height;
    }

    function isEditableTarget(target) {
      if (!(target instanceof Element)) return false;
      if (target.matches('textarea, [contenteditable="true"]')) return true;
      if (!target.matches('input')) return false;
      return /^(text|search|url|email|password|number|tel)$/i.test(target.type || 'text');
    }

    function preLiftBeforeFocus() {
      if (!savedKeyboardHeight || keyboardOpen) return;
      ignoreUntilViewportRestored = false;
      root.style.setProperty('--friday-vv-height', baselineHeight + 'px');
      root.style.setProperty('--friday-keyboard-height', savedKeyboardHeight + 'px');
      root.classList.add('friday-keyboard-prelift');
    }

    function restoreShellOnBlur() {
      if (!keyboardOpen) {
        scheduleSync();
        return;
      }
      const currentHeight = viewportHeight();
      keyboardOpen = false;
      closingFromBlur = true;
      ignoreUntilViewportRestored = currentHeight < baselineHeight - restoreTolerance();
      root.classList.remove('friday-keyboard-open', 'friday-keyboard-prelift');
      root.style.setProperty('--friday-keyboard-height', '0px');

      // One synchronous geometry reset, instead of following every iOS
      // keyboard-dismiss animation frame and repeatedly reflowing the chat.
      applyShell(0, baselineHeight, false);

      if (!ignoreUntilViewportRestored) {
        baselineHeight = currentHeight;
        closingFromBlur = false;
      }
    }

    if (composer && input && window.matchMedia?.('(pointer: coarse)').matches) {
      input.addEventListener('mousedown', event => {
        if (document.activeElement === input) return;
        event.preventDefault();
        preLiftBeforeFocus();
        try {
          input.focus({ preventScroll: true });
          const end = input.value.length;
          input.setSelectionRange(end, end);
        } catch (_) {
          input.focus();
        }

    document.addEventListener('focusin', event => {
      const target = event.target;
      if (isEditableTarget(target)) {

    document.addEventListener('touchstart', event => {
      const target = event.target instanceof Element ? event.target : null;
      touchScroller = target ? target.closest(scrollSelector) : null;

    document.addEventListener('touchmove', event => {
      const touch = event.touches[0];
      if (!touch) return;
      const y = touch.clientY;
      const deltaY = lastTouchY == null ? 0 : y - lastTouchY;

      if (!touchScroller) {
        event.preventDefault();
        return;
      }
      if (touchScroller.matches('#message-input')) return;

      const maxScroll = touchScroller.scrollHeight - touchScroller.clientHeight;
      if (maxScroll <= 1) {
        event.preventDefault();
        return;
      }

      touchScroller = null;
    };
    document.addEventListener('touchend', releaseTouch, { passive: true, capture: true });
    document.addEventListener('touchcancel', releaseTouch, { passive: true, capture: true });

    if (viewport) {
      viewport.addEventListener('resize', scheduleSync, { passive: true });
      viewport.addEventListener('scroll', scheduleSync, { passive: true });
    }
    window.addEventListener('resize', scheduleSync, { passive: true });
    window.addEventListener('orientationchange', () => {
      savedKeyboardHeight = 0;
      keyboardOpen = false;
      closingFromBlur = false;
      ignoreUntilViewportRestored = false;
      baselineHeight = Math.round(window.innerHeight || viewport?.height || baselineHeight);
      root.classList.remove('friday-keyboard-prelift', 'friday-keyboard-open');
      root.style.setProperty('--friday-keyboard-height', '0px');
      scheduleSync();
    }, { passive: true });

    window.addEventListener('pageshow', () => {
      baselineHeight = viewportHeight();
      savedKeyboardHeight = 0;
      keyboardOpen = false;
      closingFromBlur = false;
      ignoreUntilViewportRestored = false;
      root.classList.remove('friday-keyboard-prelift', 'friday-keyboard-open');
      root.style.setProperty('--friday-keyboard-height', '0px');
      applyShell(0, baselineHeight, false);
      scheduleSync();
    });

    window.addEventListener('scroll', () => {
      if (keyboardOpen && window.scrollY > 0) window.scrollTo(0, 0);
    }, { passive: true });

    scheduleSync();
  })();
  </script>

</body>
</html>
